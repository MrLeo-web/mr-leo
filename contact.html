
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact - MR LEO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080611;color:white;font-family:Arial}
header{background:#05040a;padding:20px;text-align:center;border-bottom:2px solid #ffc400}
header a{color:#ffc400;text-decoration:none;font-size:25px;font-weight:bold}
main{max-width:600px;margin:40px auto;padding:20px}
h1{text-align:center;color:#ffc400}
p{text-align:center;color:#ccc}
form{background:#171124;padding:25px;border-radius:14px}
input,textarea{width:100%;padding:14px;margin:10px 0;border:1px solid #51406c;border-radius:8px}
textarea{height:130px}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:8px;background:#20c767;color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
footer{text-align:center;color:#aaa;padding:25px}
</style>
</head>
<body>

<header><a href="index.html">💎 MR LEO</a></header>

<main>
<h1>Contactez-nous / Contact Us</h1>
<p>FR : Envoyez-nous votre message sur WhatsApp.<br>
EN: Send us your message on WhatsApp.</p>

<form id="contactForm">
<input id="name" placeholder="Nom / Name" required>
<input id="email" type="email" placeholder="Email" required>
<textarea id="message" placeholder="Votre message / Your message" required></textarea>

<button type="button" onclick="sendWhatsApp('50944398851')">
WhatsApp 1 - +509 4439 8851
</button>

<button type="button" onclick="sendWhatsApp('50932712146')">
WhatsApp 2 - +509 3271 2146
</button>
</form>
</main>

<footer>© 2026 MR LEO - Free Fire Store</footer>

<script>
function sendWhatsApp(number){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message").value.trim();

  if(!name || !email || !message){
    alert("Veuillez remplir tous les champs / Please fill in all fields.");
    return;
  }

  const text =
    "Nouveau message MR LEO\n\n" +
    "Nom: " + name + "\n" +
    "Email: " + email + "\n" +
    "Message: " + message;

  const url = "https://wa.me/" + number + "?text=" + encodeURIComponent(text);
  window.open(url, "_blank");
}
</script>

</body>
</html>
