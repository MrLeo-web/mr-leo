<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init({
  publicKey: "GDnoAo-FBhFIJDCb4"
});

document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const result = document.getElementById("result");
  result.textContent = "Envoi en cours...";

  try {
    await emailjs.send("Mrleo_777", "7rkxdjp", {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      message: document.getElementById("message").value
    });

    result.textContent = "Message envoyé avec succès ! / Message sent successfully!";
    this.reset();
  } catch (error) {
    result.textContent = "Erreur d'envoi. Réessayez / Sending error. Try again.";
    console.error(error);
  }
});
</script>
